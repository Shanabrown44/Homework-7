<!DOCTYPE html>
<html  lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us</title>
<!--Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- External CSS-->
<link rel="stylesheet" href="style.css">
<!-- Embedded styles-->
 <style>
    h1{ 
        text-align: center;
    }
    label {
        font-weight: bold;
    }
    /* Makes an invalid textbox turn light red*/
    input.invalid {
        background-color:#ffb3b3 !important;
        border: 2px solid red !important;
    }
    #termsMessage{
        color:red;
        font-weight: bold;
    }

    </style>
</head>
<body>
<h1>Contact Us</h1>
<form id="contactForm" novalidate>
<label for="name">Name:</label>
<input type="text" id="name" name="name" required>
    <br><br>

<label for="email">Email Address:</label>
<input type="email" id="email" name="email" required>
<p>Do you accept the terms of Agreement?</p>
<input type="radio" id="yes" name="terms" value="yes">
<label for="yes">Yes</label>
<input type="radio" id="no" name="terms" value="no">
<label for= "no">No</label>
<br><br>
<p id="termsMessage"></p>
<input type="submit" value="Submit">
</form>
<a href="Homepage homework 7.html">Back to Hompage</a>
<a href="story homework 7.html">Back to Story</a>
<!-- JavaScript goes here-->
<script>
    const form = document.getElementById("contactForm");
    const nameBox = document.getElementById("name");
    const emailBox = document.getElementById("email");
    const termsMessage = document.getElementById("termsMessage");

    form.addEventListener("submit", function(event) {
        event.preventDefault();

        nameBox.classList.remove("invalid");
        emailBox.classList.remove("invalid");
        termsMessage.textContent = "";
        // Check Name
        if (nameBox.value.trim()  ==="") {
            nameBox.classList.add("invalid");
            nameBox.focus();
           return;
    }
        // Check Email
        if (emailBox.value.trim() === "" || !emailBox.checkValidity()) {
            emailBox.classList.add("invalid");
            emailBox.focus();
           return; 
}
    const selectedTerms = document.querySelector(
        'input[name="terms"]:checked'
    );
   
if (!selectedTerms || selectedTerms.value === "no") { 
        termsMessage.textContent =
        "Please accept the Terms of Agreement by selecting Yes.";
        return;
}
alert("Your form has been submitted successfully!");
 });
</script>
</body>
</html>
